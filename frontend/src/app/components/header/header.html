<header class="header">
  <div class="container nav-container">
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-controls="main-navigation" [attr.aria-label]="isMenuOpen ? 'Cerrar menú' : 'Abrir menú'">
      <span aria-hidden="true">{{ isMenuOpen ? '✕' : '☰' }}</span>
    </button>
    <a class="logo" routerLink="/" (click)="isMenuOpen=false"><span class="heart" aria-hidden="true">❤️</span><span>DeliShey</span></a>
    <div class="header-actions">
      <a routerLink="/especiales" class="holiday-access" aria-label="Ir a Especiales de Navidad">Especiales</a>
      <a *ngIf="authService.isLoggedIn()" routerLink="/cart" class="action-cart" aria-label="Ver carrito">🛒<span class="badge" *ngIf="cartCount > 0">{{ cartCount }}</span></a>
      <a *ngIf="!authService.isLoggedIn()" routerLink="/login" class="account-link">Ingresar</a>
      <button *ngIf="authService.isLoggedIn()" type="button" class="account-link exit-link" (click)="logout()">Salir</button>
    </div>
  </div>
  <div class="menu-backdrop" *ngIf="isMenuOpen" (click)="isMenuOpen=false" aria-hidden="true"></div>
  <nav id="main-navigation" class="nav" [class.open]="isMenuOpen" [attr.aria-hidden]="!isMenuOpen" aria-label="Menú principal">
    <div class="menu-heading"><strong>Explorá DeliShey</strong><button type="button" aria-label="Cerrar menú" (click)="isMenuOpen=false">✕</button></div>
    <ul>
      <li><a routerLink="/" (click)="isMenuOpen=false">Inicio</a></li>
      <li><a routerLink="/category/Pastelería" (click)="isMenuOpen=false">Pastelería</a></li>
      <li><a routerLink="/category/Panadería" (click)="isMenuOpen=false">Panadería</a></li>
      <li><a routerLink="/category/Regalos" (click)="isMenuOpen=false">Regalos</a></li>
      <li><a class="special-link" routerLink="/especiales" (click)="isMenuOpen=false">✦ Especiales de Navidad</a></li>
      <li><a routerLink="/contacto" (click)="isMenuOpen=false">Contacto</a></li>
      <li *ngIf="authService.isLoggedIn()"><a routerLink="/mis-compras" (click)="isMenuOpen=false">Mis compras</a></li>
      <li *ngIf="authService.isLoggedIn()"><a routerLink="/cart" (click)="isMenuOpen=false">Carrito</a></li>
      <li *ngIf="authService.isAdmin()"><a routerLink="/admin" (click)="isMenuOpen=false">Administración</a></li>
      <li *ngIf="authService.isAdmin()"><a routerLink="/admin/ventas" (click)="isMenuOpen=false">Ventas</a></li>
    </ul>
  </nav>
</header>
