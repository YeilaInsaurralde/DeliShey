<div class="login-container container">

  <div class="card login-card">

    <h2>Nueva contraseña</h2>

    <p>
      Ingrese su nueva contraseña
    </p>

    <div
      class="alert alert-error"
      *ngIf="error">

      {{ error }}

    </div>

    <div
      class="alert alert-success"
      *ngIf="success">

      {{ success }}

    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">

        <label>
          Nueva contraseña
        </label>


        <div class="password-field">


          <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          required minlength="8" maxlength="72"
        >


          <button class="password-toggle" type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>


        </div>

      </div>

      <div class="form-group">

        <label>
          Confirmar contraseña
        </label>


        <div class="password-field">


          <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword"
          name="confirmPassword"
          required minlength="8" maxlength="72"
        >


          <button class="password-toggle" type="button" (click)="showConfirmPassword = !showConfirmPassword" [attr.aria-label]="showConfirmPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <i class="fa" [ngClass]="showConfirmPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>


        </div>

      </div>

      <button
        type="submit" [disabled]="submitting"
        class="btn-primary w-100">

        Cambiar contraseña

      </button>

    </form>

  </div>

</div>
