<div class="login-container container">

  <div class="card login-card">

    <h2>Crear Cuenta</h2>

    <p>Registrate en Deli Shey</p>

    <div class="alert alert-error" *ngIf="error">
      {{ error }}
    </div>

    <div class="alert alert-success" *ngIf="success">
      {{ success }}
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">

        <label>Nombre</label>

        <input
          type="text"
          [(ngModel)]="name"
          name="name" required maxlength="100"
          required
        >

      </div>

      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          [(ngModel)]="email"
          name="email" required maxlength="100"
          required
        >

      </div>

      <div class="form-group">

        <label>Contraseña</label>


        <div class="password-field">


          <input
          [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="password"
          name="password"
          required minlength="8" maxlength="72"
        >


          <button class="password-toggle" type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>


        </div>

      </div>

      <button
        type="submit" [disabled]="submitting"
        class="btn-primary w-100"
      >
        Registrarse
      </button>

    </form>

  </div>

</div>
