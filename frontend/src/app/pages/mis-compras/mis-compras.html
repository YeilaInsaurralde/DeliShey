<div class="container py-5">
  <h2>Mis compras</h2>
  <p class="subtitle">Calificá los productos que compraste. Tu opinión la van a ver otros clientes.</p>

  <div class="notification error" *ngIf="error">{{ error }}</div>

  <div class="empty" *ngIf="!loading && products.length === 0">
    Todavía no compraste ningún producto.
  </div>

  <div class="purchase-list" *ngIf="products.length > 0">
    <div class="card purchase-card" *ngFor="let product of products">

      <div class="img-wrapper">
        <img [src]="product.image" [alt]="product.name">
      </div>

      <div class="info">
        <h3>{{ product.name }}</h3>

        <div class="stars">
          <span
            *ngFor="let star of stars"
            class="star"
            [class.filled]="star <= (product.rating || 0)"
            (click)="setRating(product, star)"
          >★</span>
        </div>

        <textarea
          class="comment"
          placeholder="Contá qué te pareció (opcional)"
          [(ngModel)]="product.comment"
          maxlength="500"
        ></textarea>

        <button class="btn-primary w-100" (click)="save(product)" [disabled]="!product.rating">
          Guardar calificación
        </button>

        <span class="saved-msg" *ngIf="savedId === product.id">¡Gracias por tu opinión!</span>
      </div>
    </div>
  </div>
</div>
