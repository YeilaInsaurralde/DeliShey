<div class="login-container container">

  <div class="card login-card">

    <h2>Iniciar Sesión</h2>

    <p>Ingresa a Deli Shey para realizar tus pedidos</p>

    <div class="alert alert-error" *ngIf="error">
      {{ error }}
    </div>

    <div class="alert alert-success" *ngIf="success">
      {{ success }}
    </div>

    <form (ngSubmit)="onSubmit()">

      <div class="form-group">

        <label>Email</label>

        <input type="email" [(ngModel)]="email" name="email" required maxlength="100" placeholder="tu@email.com">

      </div>

      <div class="form-group">

        <label>Contraseña</label>


        <div class="password-field">


          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password" required placeholder="******">


          <button class="password-toggle" type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          <i class="fa" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>


        </div>

      </div>

      <button type="submit" [disabled]="submitting" class="btn-primary w-100">
        Ingresar
      </button>

      <div class="register-link">
        <a routerLink="/forgot-password">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

    </form>

    <div class="register-link">

      <p>
        ¿No tienes cuenta?
      </p>

      <a routerLink="/register">
        Registrarse
      </a>

    </div>

  </div>

</div>
